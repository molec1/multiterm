[project]
name = "multiterm"
version = "0.1.0"
description = "Terminal tabs that remember their folder and command history"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["multiterm", "tests", "bin"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# PyGObject requires gi.require_version() before importing from gi.repository.
"multiterm/app.py" = ["E402"]
"multiterm/style.py" = ["E402"]
"multiterm/window.py" = ["E402"]
"multiterm/preferences.py" = ["E402"]
"tests/test_restore.py" = ["E402"]
"tests/test_groups.py" = ["E402"]
"tests/test_preferences.py" = ["E402"]
"bin/multiterm" = ["E402"]
